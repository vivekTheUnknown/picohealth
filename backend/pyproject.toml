[project]
name = "health-portal-api"
version = "0.1.0"
description = "FastAPI backend for the Patient-Centric Wearable Health Monitoring portal"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# B008: FastAPI's Depends()/Query() in defaults is the framework idiom.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"app/models/__init__.py" = ["F401"]
"tests/*" = ["RUF059"]
